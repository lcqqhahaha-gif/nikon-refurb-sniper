name: Nikon Refurb Sniper

on:
  schedule:
    # Runs every 20 minutes, 24/7
    - cron: '*/20 * * * *'
  workflow_dispatch:

permissions:
  contents: write

env:
  # Silences the Node.js 20 deprecation warning on GitHub runners
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  snipe:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Get latest Playwright version
        id: playwright-ver
        run: |
          pip install playwright
          echo "version=$(python -c 'import importlib.metadata; print(importlib.metadata.version("playwright"))')" >> $GITHUB_OUTPUT

      - name: Cache Playwright browser
        id: cache-playwright
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          # Automatically busts the cache whenever Playwright releases a new version!
          key: ${{ runner.os }}-playwright-chromium-${{ steps.playwright-ver.outputs.version }}

      - name: Install Playwright browser
        run: |
          if [ "${{ steps.cache-playwright.outputs.cache-hit }}" != "true" ]; then
            playwright install --with-deps chromium
          else
            playwright install-deps chromium
          fi

      - name: Run Nikon Sniper
        env:
          BARK_KEY: ${{ secrets.BARK_KEY }}
        run: python nikon_sniper.py

      - name: Save alert state to repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state.json || true
          if ! git diff --staged --quiet; then
            git commit -m "Update sniper alert state [skip ci]"
            git pull --rebase origin main
            git push
          fi
